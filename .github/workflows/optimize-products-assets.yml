name: Optimize product assets

on:
  push:
    branches:
      - optimize-products-assets
    paths:
      - products/legacy.html
      - scripts/extract_product_assets.py
      - .github/workflows/optimize-products-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-assets:
    if: ${{ !contains(github.event.head_commit.message, '[assets-optimized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract embedded product images
        run: python3 scripts/extract_product_assets.py

      - name: Commit optimized product assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No optimization changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/legacy.html products/assets
          git commit -m "Optimize product image assets [assets-optimized]"
          git push
