<script id="labwrk-products-layout">
(()=>{
  let fitTimer;

  const resetDesktopTweaks=()=>{
    const main=document.querySelector('main');
    if(main){main.style.removeProperty('zoom');main.style.removeProperty('transform');}
  };

  const markProductMedia=()=>{
    document.querySelectorAll('.labwrk-product-photo').forEach(el=>el.classList.remove('labwrk-product-photo'));
    document.querySelectorAll('.labwrk-media-parent').forEach(el=>el.classList.remove('labwrk-media-parent'));
    document.querySelectorAll('.labwrk-media-shell').forEach(el=>el.classList.remove('labwrk-media-shell'));

    if(window.innerWidth<=900)return;

    [...document.images].forEach(img=>{
      /* Only large photographic assets; icons/logo stay untouched. */
      if(img.naturalWidth<500 || img.naturalHeight<300)return;
      img.classList.add('labwrk-product-photo');
      const parent=img.parentElement;
      if(parent)parent.classList.add('labwrk-media-parent');
      let shell=parent;
      for(let depth=0;depth<3 && shell && shell!==document.body && shell!==document.documentElement;depth++,shell=shell.parentElement){
        shell.classList.add('labwrk-media-shell');
      }
    });
  };

  const fitDesktop=()=>{
    clearTimeout(fitTimer);
    fitTimer=setTimeout(()=>{
      const main=document.querySelector('main');
      if(!main)return;
      resetDesktopTweaks();
      if(window.innerWidth<=900)return;

      /* Give layout/images two frames to settle, then fit the complete page. */
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        const naturalHeight=Math.max(main.scrollHeight,main.getBoundingClientRect().height);
        const available=Math.max(1,window.innerHeight-4);
        if(naturalHeight>available){
          const scale=Math.min(1,available/naturalHeight);
          main.style.setProperty('zoom',scale.toFixed(4));
        }
      }));
    },50);
  };

  const apply=()=>{
    markProductMedia();
    fitDesktop();
  };

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});
  else apply();

  window.addEventListener('load',apply,{once:true});
  window.addEventListener('resize',apply,{passive:true});
  document.querySelectorAll('img').forEach(img=>{
    if(!img.complete)img.addEventListener('load',apply,{once:true});
  });
})();
<\/script>

<\/script>`;
    document.open();
