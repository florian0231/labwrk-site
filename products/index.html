<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D161F">
<title>Products — LABWRK.</title>
<link rel="icon" type="image/png" href="../favicon.png">
<style>
:root{
  --bg:#1D161F;
  --fg:#F2EEF4;
  --muted:#948A98;
  --line:rgba(242,238,244,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--fg);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.shell{
  width:min(100%,1900px);
  margin:0 auto;
  padding:0 clamp(24px,5vw,82px) clamp(90px,9vw,150px);
}
.topbar{
  min-height:clamp(76px,7vw,106px);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand,.section-label{
  margin:0;
  font-weight:900;
  text-transform:uppercase;
}
.brand{
  font-size:clamp(13px,1.05vw,17px);
  letter-spacing:-.035em;
  text-decoration:none;
}
.section-label{
  color:var(--muted);
  font-size:clamp(8px,.62vw,10px);
  letter-spacing:.18em;
}
.hero{
  padding-top:clamp(42px,5vw,78px);
}
.page-title{
  width:min(88%,1500px);
  margin:0 auto clamp(34px,4vw,62px);
  font-size:clamp(4.3rem,9.4vw,10.8rem);
  line-height:.78;
  letter-spacing:-.068em;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
}
.product-visual{
  position:relative;
  width:min(88%,1500px);
  height:clamp(430px,47vw,720px);
  margin:0 auto;
  overflow:hidden;
  background:#151117;
  isolation:isolate;
  cursor:pointer;
}
.product-visual::after{
  content:"VIEW / HOVER";
  position:absolute;
  right:18px;
  bottom:16px;
  z-index:4;
  padding:7px 9px;
  color:rgba(242,238,244,.72);
  background:rgba(29,22,31,.35);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  font-size:8px;
  font-weight:700;
  letter-spacing:.14em;
  opacity:0;
  transition:opacity .25s ease;
  pointer-events:none;
}
.product-visual:hover::after{opacity:1}
.product-visual img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center;
  border:0;
  transition:opacity .7s cubic-bezier(.22,.61,.36,1),transform 1.1s cubic-bezier(.22,.61,.36,1);
  will-change:opacity,transform;
}
.product-visual .image-primary{opacity:1;z-index:1}
.product-visual .image-secondary{opacity:0;z-index:2}
@media(hover:hover) and (pointer:fine){
  .product-visual:hover .image-primary{opacity:0;transform:scale(1.018)}
  .product-visual:hover .image-secondary{opacity:1;transform:scale(1.018)}
}
.product-visual.is-alt .image-primary{opacity:0;transform:scale(1.012)}
.product-visual.is-alt .image-secondary{opacity:1;transform:scale(1.012)}
.product-info{
  width:min(88%,1500px);
  margin:clamp(34px,3.6vw,56px) auto 0;
  padding-top:clamp(24px,2.8vw,40px);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:minmax(0,.95fr) minmax(320px,.85fr);
  gap:clamp(46px,8vw,140px);
  align-items:start;
}
.product-title{
  margin:0;
  max-width:12ch;
  font-size:clamp(2.8rem,5.2vw,5.9rem);
  line-height:.86;
  letter-spacing:-.058em;
  font-weight:900;
  text-transform:uppercase;
}
.compatibility{
  margin-top:clamp(16px,1.6vw,24px);
  color:var(--muted);
  font-size:clamp(9px,.72vw,11px);
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.description{
  padding-top:.3em;
  font-size:clamp(16px,1.18vw,19px);
  line-height:1.58;
  letter-spacing:-.012em;
}
.description p{margin:0 0 .48em}
.description p:last-child{
  margin-top:1.25em;
  font-weight:700;
  letter-spacing:.01em;
}
.footer{
  width:min(88%,1500px);
  margin:clamp(100px,12vw,190px) auto 0;
  padding-top:24px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.footer a{text-decoration:none;color:var(--fg);transition:opacity .2s ease}
.footer a:hover{opacity:.55}
.loading{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
}
@media(max-width:900px){
  .shell{padding-left:18px;padding-right:18px}
  .hero{padding-top:34px}
  .page-title,.product-visual,.product-info,.footer{width:100%}
  .page-title{
    margin-bottom:28px;
    font-size:clamp(3.6rem,17vw,7rem);
    white-space:normal;
  }
  .product-visual{height:clamp(390px,82vw,620px)}
  .product-info{
    grid-template-columns:1fr;
    gap:28px;
    margin-top:30px;
  }
  .product-title{max-width:none;font-size:clamp(2.8rem,12vw,5.2rem)}
  .description{padding-top:0}
}
@media(max-width:560px){
  .topbar{min-height:68px}
  .hero{padding-top:24px}
  .page-title{font-size:clamp(3.15rem,18vw,5rem)}
  .product-visual{height:112vw;max-height:580px}
  .product-info{margin-top:24px;padding-top:22px}
  .description{font-size:16px}
  .footer{margin-top:90px;align-items:flex-start;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
  .product-visual img{transition:none!important}
}
</style>
</head>
<body>
<main class="shell">
  <nav class="topbar">
    <a class="brand" href="../">LABWRK.</a>
    <span class="section-label">Products</span>
  </nav>

  <section class="hero">
    <h1 class="page-title">PRODUCTS.</h1>

    <div id="heroVisual" class="product-visual" role="button" tabindex="0" aria-label="Produktbild wechseln">
      <div class="loading">Loading product</div>
    </div>

    <section class="product-info" aria-label="Produktinformationen">
      <div>
        <h2 class="product-title">DOMLAGERABDECKUNG.</h2>
        <div class="compatibility">BMW E60 · E61 · E63 · E64</div>
      </div>
      <div class="description">
        <p>Abdeckung für den sichtbaren Domlagerbereich.</p>
        <p>Passend für BMW E60, E61, E63 und E64.</p>
        <p>OEM+ Optik</p>
      </div>
    </section>
  </section>

  <footer class="footer">
    <a href="../">← Back to LABWRK.</a>
    <span>Automotive Details / 2026</span>
  </footer>
</main>

<script>
(async()=>{
  const hero=document.getElementById('heroVisual');
  const probe=src=>new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>resolve({src,w:img.naturalWidth,h:img.naturalHeight});
    img.onerror=()=>resolve(null);
    img.src=src;
  });

  try{
    const legacy=await fetch('./legacy.html',{cache:'no-store'}).then(r=>{
      if(!r.ok)throw new Error(r.status);
      return r.text();
    });
    const doc=new DOMParser().parseFromString(legacy,'text/html');
    const sources=[...doc.images].map(img=>img.getAttribute('src')).filter(Boolean);
    const tested=(await Promise.all(sources.slice(0,16).map(probe))).filter(Boolean);
    const large=tested.filter(x=>x.w>=500&&x.h>=300);
    if(large.length<2)throw new Error('not enough product images');

    const installed=large[0];
    const product=large[1];

    hero.innerHTML=`
      <img class="image-primary" src="${product.src}" alt="LABWRK Domlagerabdeckung Produktansicht">
      <img class="image-secondary" src="${installed.src}" alt="LABWRK Domlagerabdeckung im eingebauten Zustand">
    `;

    const toggle=()=>hero.classList.toggle('is-alt');
    hero.addEventListener('click',e=>{
      if(matchMedia('(hover:hover) and (pointer:fine)').matches)return;
      e.preventDefault();
      toggle();
    });
    hero.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}
    });
  }catch(err){
    hero.innerHTML='<div class="loading">Product image unavailable</div>';
  }
})();

(()=>{
  const titles=['Products — LABWRK.','LABWRK. / AUTOMOTIVE DETAILS'];
  let i=0;
  setInterval(()=>{i=(i+1)%titles.length;document.title=titles[i]},2600);
})();
</script>
</body>
</html>
