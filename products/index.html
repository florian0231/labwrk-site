<script id="labwrk-tab-animation">
(()=>{const titles=['Products — LABWRK.','LABWRK. / AUTOMOTIVE DETAILS'];let i=0;setInterval(()=>{i=(i+1)%titles.length;document.title=titles[i]},2400);const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');let t=0;let l=document.querySelector('link[rel="icon"]');if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l)}setInterval(()=>{t+=.18;const p=(Math.sin(t)+1)/2;x.clearRect(0,0,64,64);x.fillStyle='#111';x.beginPath();x.arc(32,32,17+4*p,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='bold 18px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('L.',32,33);l.href=c.toDataURL('image/png')},160)})();
<\/script>`;
