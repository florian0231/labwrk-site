<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D161F">
<meta name="description" content="LABWRK. Domlagerabdeckung für BMW E60, E61, E63 und E64.">
<title>Products — LABWRK.</title>
<link rel="icon" type="image/png" href="../favicon.png">
<style>
:root{
  --bg:#1D161F;
  --fg:#F2EEF4;
  --muted:#948A98;
  --line:rgba(242,238,244,.12);
  --panel:#D4D6E0;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--fg);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.shell{
  width:min(100%,1800px);
  margin:0 auto;
  padding:0 clamp(24px,5vw,82px) clamp(90px,9vw,150px);
}
.topbar{
  min-height:clamp(72px,6vw,92px);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand,.section-label{
  margin:0;
  font-weight:900;
  text-transform:uppercase;
}
.brand{
  font-size:clamp(13px,.95vw,16px);
  letter-spacing:-.035em;
  text-decoration:none;
}
.section-label{
  color:var(--muted);
  font-size:clamp(8px,.58vw,10px);
  letter-spacing:.18em;
}
.hero{
  width:min(76vw,1100px);
  margin:0 auto;
  padding-top:clamp(16px,2.5vw,34px);
}
.page-title{
  margin:0 0 clamp(18px,2vw,28px);
  font-size:clamp(3rem,5.2vw,5.6rem);
  line-height:.84;
  letter-spacing:-.065em;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
}
.product-visual{
  position:relative;
  width:100%;
  height:min(50vw,510px);
  min-height:340px;
  overflow:hidden;
  background:var(--panel);
  isolation:isolate;
  cursor:pointer;
}
.product-visual img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  border:0;
  transition:opacity .7s cubic-bezier(.22,.61,.36,1),transform 1.1s cubic-bezier(.22,.61,.36,1);
  will-change:opacity,transform;
}
.product-visual .image-primary{
  z-index:1;
  opacity:1;
  object-fit:contain;
  object-position:center;
  padding:2.6%;
}
.product-visual .image-secondary{
  z-index:2;
  opacity:0;
  object-fit:cover;
  object-position:center;
}
.product-visual::after{
  content:"VIEW / HOVER";
  position:absolute;
  right:16px;
  bottom:14px;
  z-index:4;
  padding:7px 9px;
  color:rgba(242,238,244,.72);
  background:rgba(29,22,31,.38);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  font-size:8px;
  font-weight:700;
  letter-spacing:.14em;
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
}
@media(hover:hover) and (pointer:fine){
  .product-visual:hover::after{opacity:1}
  .product-visual:hover .image-primary{opacity:0;transform:scale(1.012)}
  .product-visual:hover .image-secondary{opacity:1;transform:scale(1.012)}
}
.product-visual.is-alt .image-primary{opacity:0;transform:scale(1.01)}
.product-visual.is-alt .image-secondary{opacity:1;transform:scale(1.01)}
.hero-meta{
  margin-top:14px;
  display:grid;
  grid-template-columns:44px minmax(0,1fr) auto;
  gap:16px;
  align-items:center;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.hero-meta strong{
  color:var(--fg);
  font-weight:700;
}
.product-info{
  width:min(76vw,1100px);
  margin:clamp(72px,8vw,125px) auto 0;
  display:grid;
  grid-template-columns:72px minmax(0,1fr);
  gap:clamp(24px,4vw,64px);
  align-items:start;
}
.index{
  padding-top:.55em;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:.15em;
}
.product-copy{
  width:min(720px,100%);
}
.product-title{
  margin:0;
  font-size:clamp(2.8rem,5vw,5.3rem);
  line-height:.88;
  letter-spacing:-.058em;
  font-weight:900;
  text-transform:uppercase;
}
.compatibility{
  margin-top:clamp(14px,1.5vw,22px);
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.description{
  width:min(620px,100%);
  margin-top:clamp(30px,3vw,46px);
  font-size:clamp(16px,1.12vw,18px);
  line-height:1.62;
  letter-spacing:-.01em;
}
.description p{margin:0 0 .42em}
.description .oem{
  margin-top:1.15em;
  font-weight:700;
  letter-spacing:.01em;
}
.footer{
  width:min(76vw,1100px);
  margin:clamp(105px,12vw,190px) auto 0;
  padding-top:24px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.footer a{text-decoration:none;color:var(--fg);transition:opacity .2s ease}
.footer a:hover{opacity:.55}
@media(max-width:900px){
  .shell{padding-left:18px;padding-right:18px}
  .topbar{min-height:68px}
  .hero,.product-info,.footer{width:100%}
  .hero{padding-top:20px}
  .page-title{
    margin-bottom:18px;
    font-size:clamp(2.8rem,14vw,5rem);
    white-space:normal;
  }
  .product-visual{
    height:auto;
    min-height:0;
    aspect-ratio:4/5;
  }
  .hero-meta{
    grid-template-columns:34px 1fr;
    row-gap:7px;
  }
  .hero-meta span:last-child{grid-column:2}
  .product-info{
    margin-top:70px;
    grid-template-columns:1fr;
    gap:18px;
  }
  .index{padding-top:0}
  .product-title{font-size:clamp(2.65rem,11.5vw,4.8rem)}
  .description{margin-top:26px;font-size:16px}
}
@media(max-width:560px){
  .hero{padding-top:14px}
  .page-title{font-size:clamp(2.55rem,15vw,4.2rem)}
  .product-info{margin-top:58px}
  .footer{margin-top:88px;align-items:flex-start;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
  .product-visual img{transition:none!important}
}
</style>
</head>
<body>
<main class="shell">
  <nav class="topbar">
    <a class="brand" href="../">LABWRK.</a>
    <span class="section-label">Products</span>
  </nav>

  <section class="hero">
    <h1 class="page-title">PRODUCTS.</h1>

    <div id="heroVisual" class="product-visual" role="button" tabindex="0" aria-label="Produktbild wechseln">
      <img class="image-primary" src="assets/embedded-04db9b3f18a4af37.png" alt="LABWRK Domlagerabdeckung Produktansicht">
      <img class="image-secondary" src="assets/embedded-4db0bce3bc9649ae.jpg" alt="LABWRK Domlagerabdeckung montiert im BMW Motorraum">
    </div>

    <div class="hero-meta" aria-label="Produktübersicht">
      <span>01</span>
      <strong>Domlagerabdeckung.</strong>
      <span>BMW E60 · E61 · E63 · E64</span>
    </div>
  </section>

  <section class="product-info" aria-label="Produktinformationen">
    <div class="index">01 / 01</div>
    <div class="product-copy">
      <h2 class="product-title">DOMLAGERABDECKUNG.</h2>
      <div class="compatibility">BMW E60 · E61 · E63 · E64</div>
      <div class="description">
        <p>Abdeckung für den sichtbaren Domlagerbereich.</p>
        <p>Passend für BMW E60, E61, E63 und E64.</p>
        <p class="oem">OEM+ Optik</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <a href="../">← Back to LABWRK.</a>
    <span>Automotive Details / 2026</span>
  </footer>
</main>
<script>
(()=>{
  const hero=document.getElementById('heroVisual');
  const toggle=()=>hero.classList.toggle('is-alt');
  hero.addEventListener('click',e=>{
    if(matchMedia('(hover:hover) and (pointer:fine)').matches)return;
    e.preventDefault();
    toggle();
  });
  hero.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}
  });
})();
</script>
</body>
</html>
