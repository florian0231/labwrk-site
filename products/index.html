<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEBE7">
<title>Products — LABWRK.</title>
<meta name="description" content="LABWRK. Produkte: Domlagerabdeckung und Ghost Grill-Badge.">
<link rel="canonical" href="https://labwrk.de/products/">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/products/products.css">
</head>
<body>
<div id="labwrk-catalog">
<nav class="lw-nav" aria-label="Hauptnavigation"><a href="/" class="lw-brand">LABWRK.</a><span>PRODUCTS</span></nav>
<main class="lw-content">
<section class="lw-overview" aria-label="Produktübersicht">
  <h1>PRODUCTS.</h1>
  <nav class="lw-filters" aria-label="Produktkategorien">
   <button class="lw-filter" data-category="all" aria-pressed="true">ALLE</button>
   <button class="lw-filter" data-category="covers" aria-pressed="false">ABDECKUNGEN</button>
   <button class="lw-filter" data-category="badges" aria-pressed="false">BADGES</button>
  </nav>
  <div class="lw-grid">
   <article class="lw-product" data-kind="covers">
    <a class="lw-open" href="/products/domlagerabdeckung/" aria-label="Domlagerabdeckung – Details ansehen">
     <div class="lw-photo"><img class="lw-primary" src="/products/assets/embedded-04db9b3f18a4af37.png" alt="LABWRK Domlagerabdeckungen"><img class="lw-secondary" src="/products/assets/embedded-4db0bce3bc9649ae.jpg" alt="Domlagerabdeckung im Motorraum"></div>
     <div class="lw-meta"><span>01 / ABDECKUNGEN</span><span>↗</span></div>
     <h2>DOMLAGERABDECKUNG.</h2>
     <p class="lw-sub">BMW E60 · E61 · E63 · E64</p>
    </a>
   </article>
   <article class="lw-product" data-kind="badges">
    <a class="lw-open lw-badge-open" href="/products/ghost-badge/" aria-label="Ghost Badge – Details ansehen">
     <div class="lw-photo lw-badge-photo"><img class="lw-badge-image" src="/products/assets/ghost-badge.jpeg" alt="Ghost Grill-Badge mit schwarzem Rahmen und weißer Front"></div>
     <div class="lw-meta"><span>02 / BADGES</span><span>↗</span></div>
     <h2>GHOST BADGE.</h2><p class="lw-sub">GRILL-BADGE · SCHWARZ / WEISS</p>
    </a>
   </article>
  </div>
 </section>
</main>
<footer class="lw-foot"><a href="/">← BACK TO LABWRK.</a><span>AUTOMOTIVE DETAILS / 2026</span></footer>
</div>
<script>
(()=>{
 const root=document.getElementById('labwrk-catalog');
 const filters=[...root.querySelectorAll('.lw-filter')];
 filters.forEach(button=>button.addEventListener('click',()=>{
  filters.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
  root.querySelectorAll('[data-kind]').forEach(p=>p.hidden=button.dataset.category!=='all'&&p.dataset.kind!==button.dataset.category);
 }));
})();
</script>
</body>
</html>
