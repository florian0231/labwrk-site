<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D161F">
<meta name="description" content="LABWRK. Domlagerabdeckung für BMW E60, E61, E63 und E64.">
<title>Products — LABWRK.</title>
<link rel="icon" type="image/png" href="../favicon.png">
<style>
:root{
  --bg:#1D161F;
  --fg:#F2EEF4;
  --muted:#948A98;
  --line:rgba(242,238,244,.13);
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--fg);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.shell{
  width:min(100%,1720px);
  margin:0 auto;
  padding:0 clamp(20px,4.2vw,72px) clamp(80px,8vw,140px);
}
.topbar{
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}
.brand{
  text-decoration:none;
  font-size:15px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.045em;
  text-transform:uppercase;
}
.section-label{
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.hero{
  padding-top:clamp(28px,4vw,60px);
}
.page-title{
  width:min(76vw,1180px);
  margin:0 auto clamp(24px,2.8vw,42px);
  font-size:clamp(4rem,8vw,8.6rem);
  line-height:.80;
  letter-spacing:-.068em;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
}
.product-visual{
  position:relative;
  width:min(76vw,1180px);
  aspect-ratio:6/5;
  margin:0 auto;
  overflow:hidden;
  background:#D4D6E0;
  isolation:isolate;
  cursor:pointer;
}
.product-visual img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  border:0;
  will-change:opacity,transform;
  transition:opacity .65s cubic-bezier(.22,.61,.36,1),transform 1s cubic-bezier(.22,.61,.36,1);
}
.product-visual .image-primary{
  z-index:1;
  opacity:1;
  object-fit:contain;
  object-position:center;
}
.product-visual .image-secondary{
  z-index:2;
  opacity:0;
  object-fit:cover;
  object-position:center;
}
.product-visual::after{
  content:"VIEW / HOVER";
  position:absolute;
  right:14px;
  bottom:13px;
  z-index:4;
  padding:7px 9px;
  color:rgba(242,238,244,.78);
  background:rgba(29,22,31,.42);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  font-size:8px;
  font-weight:700;
  letter-spacing:.14em;
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
}
@media(hover:hover) and (pointer:fine){
  .product-visual:hover::after{opacity:1}
  .product-visual:hover .image-primary{opacity:0;transform:scale(1.01)}
  .product-visual:hover .image-secondary{opacity:1;transform:scale(1.012)}
}
.product-visual.is-alt .image-primary{opacity:0;transform:scale(1.01)}
.product-visual.is-alt .image-secondary{opacity:1;transform:scale(1.012)}
.product-info{
  width:min(76vw,1180px);
  margin:0 auto;
  padding-top:clamp(24px,2.6vw,38px);
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);
  gap:clamp(42px,7vw,110px);
  align-items:start;
}
.product-title{
  margin:0;
  max-width:12ch;
  font-size:clamp(2.7rem,4.8vw,5.3rem);
  line-height:.86;
  letter-spacing:-.058em;
  font-weight:900;
  text-transform:uppercase;
}
.compatibility{
  margin-top:14px;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.description{
  padding-top:.28em;
  font-size:clamp(15px,1.06vw,18px);
  line-height:1.65;
  letter-spacing:-.01em;
}
.description p{margin:0 0 .38em}
.description .oem{
  margin-top:1.15em;
  font-weight:700;
  letter-spacing:.01em;
}
.footer{
  width:min(76vw,1180px);
  margin:clamp(92px,10vw,160px) auto 0;
  padding-top:22px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.footer a{text-decoration:none;color:var(--fg);transition:opacity .2s ease}
.footer a:hover{opacity:.55}
@media(max-width:900px){
  .shell{padding-left:18px;padding-right:18px}
  .topbar{min-height:70px}
  .hero{padding-top:28px}
  .page-title,.product-visual,.product-info,.footer{width:100%}
  .page-title{
    margin-bottom:24px;
    font-size:clamp(3.5rem,16vw,6.8rem);
    white-space:normal;
  }
  .product-visual{aspect-ratio:4/5}
  .product-info{
    grid-template-columns:1fr;
    gap:24px;
    padding-top:24px;
  }
  .product-title{max-width:none;font-size:clamp(2.8rem,11vw,5rem)}
  .description{padding-top:0;font-size:16px}
}
@media(max-width:560px){
  .hero{padding-top:20px}
  .page-title{font-size:clamp(3rem,17vw,4.8rem)}
  .product-info{padding-top:21px}
  .footer{margin-top:82px;align-items:flex-start;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
  .product-visual img{transition:none!important}
}
</style>
</head>
<body>
<main class="shell">
  <nav class="topbar">
    <a class="brand" href="../">LABWRK.</a>
    <span class="section-label">Products</span>
  </nav>

  <section class="hero">
    <h1 class="page-title">PRODUCTS.</h1>

    <div id="heroVisual" class="product-visual" role="button" tabindex="0" aria-label="Produktbild wechseln">
      <img class="image-primary" src="assets/embedded-04db9b3f18a4af37.png" alt="LABWRK Domlagerabdeckung Produktansicht">
      <img class="image-secondary" src="assets/embedded-4db0bce3bc9649ae.jpg" alt="LABWRK Domlagerabdeckung montiert im BMW Motorraum">
    </div>

    <section class="product-info" aria-label="Produktinformationen">
      <div>
        <h2 class="product-title">DOMLAGERABDECKUNG.</h2>
        <div class="compatibility">BMW E60 · E61 · E63 · E64</div>
      </div>
      <div class="description">
        <p>Abdeckung für den sichtbaren Domlagerbereich.</p>
        <p>Passend für BMW E60, E61, E63 und E64.</p>
        <p class="oem">OEM+ Optik</p>
      </div>
    </section>
  </section>

  <footer class="footer">
    <a href="../">← Back to LABWRK.</a>
    <span>Automotive Details / 2026</span>
  </footer>
</main>
<script>
(()=>{
  const hero=document.getElementById('heroVisual');
  const toggle=()=>hero.classList.toggle('is-alt');
  hero.addEventListener('click',e=>{
    if(matchMedia('(hover:hover) and (pointer:fine)').matches)return;
    e.preventDefault();
    toggle();
  });
  hero.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}
  });
})();
</script>
</body>
</html>
