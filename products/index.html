<script id="labwrk-products-editorial-layout">
(()=>{
  const clearClasses=()=>{
    document.querySelectorAll('.labwrk-product-photo').forEach(el=>el.classList.remove('labwrk-product-photo'));
    document.querySelectorAll('.labwrk-media-parent').forEach(el=>el.classList.remove('labwrk-media-parent'));
    document.querySelectorAll('.labwrk-media-shell').forEach(el=>el.classList.remove('labwrk-media-shell'));
    document.querySelectorAll('.labwrk-gallery').forEach(el=>el.classList.remove('labwrk-gallery'));
    document.querySelectorAll('.labwrk-product-copy').forEach(el=>el.classList.remove('labwrk-product-copy'));
  };

  const commonAncestor=(a,b)=>{
    const seen=new Set();
    let n=a;
    while(n&&n!==document.body){seen.add(n);n=n.parentElement;}
    n=b;
    while(n&&n!==document.body){if(seen.has(n))return n;n=n.parentElement;}
    return null;
  };

  const apply=()=>{
    clearClasses();

    const photos=[...document.images].filter(img=>img.naturalWidth>=500&&img.naturalHeight>=300);
    photos.forEach(img=>{
      img.classList.add('labwrk-product-photo');
      const p=img.parentElement;
      if(p)p.classList.add('labwrk-media-parent');
      let shell=p;
      for(let i=0;i<3&&shell&&shell!==document.body&&shell!==document.documentElement;i++,shell=shell.parentElement){
        shell.classList.add('labwrk-media-shell');
      }
    });

    if(photos.length>=2){
      const common=commonAncestor(photos[0],photos[1]);
      if(common&&common!==document.querySelector('main')){
        common.classList.add('labwrk-gallery');
      }else{
        /* If the old markup has no dedicated gallery wrapper, use the closest
           two media wrappers and create a visual grid on their nearest safe parent. */
        const p1=photos[0].parentElement;
        const p2=photos[1].parentElement;
        const fallback=commonAncestor(p1,p2);
        if(fallback&&fallback!==document.body)fallback.classList.add('labwrk-gallery');
      }
    }

    /* Mark the first substantial text block after the gallery for calmer width. */
    const gallery=document.querySelector('.labwrk-gallery');
    if(gallery){
      let next=gallery.nextElementSibling;
      while(next&&next.tagName==='SCRIPT')next=next.nextElementSibling;
      if(next)next.classList.add('labwrk-product-copy');
    }
  };

  const boot=()=>{
    apply();
    document.querySelectorAll('img').forEach(img=>{
      if(!img.complete)img.addEventListener('load',apply,{once:true});
    });
    setTimeout(apply,250);
    setTimeout(apply,900);
  };

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});
  else boot();
  window.addEventListener('resize',()=>{clearTimeout(window.__labwrkResize);window.__labwrkResize=setTimeout(apply,120)},{passive:true});
})();
<\/script>

<\/script>`;
