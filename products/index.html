<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEBE7">
<meta name="description" content="LABWRK. Domlagerabdeckung für BMW E60, E61, E63 und E64.">
<title>Products — LABWRK.</title>
<link rel="icon" type="image/png" href="../favicon.png">
<style>
:root{
  --bg:#ECEBE7;
  --fg:#111318;
  --muted:#78717C;
  --line:rgba(17,19,24,.12);
  --panel:#D4D6E0;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--fg);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.shell{
  width:min(100%,1800px);
  margin:0 auto;
  padding:0 clamp(24px,5vw,82px) clamp(90px,9vw,150px);
}
.topbar{
  min-height:clamp(72px,6vw,92px);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand,.section-label{
  margin:0;
  font-weight:900;
  text-transform:uppercase;
}
.brand{
  font-size:clamp(13px,.95vw,16px);
  letter-spacing:-.035em;
  text-decoration:none;
}
.section-label{
  color:var(--muted);
  font-size:clamp(8px,.58vw,10px);
  letter-spacing:.18em;
}
.hero{
  width:min(70vw,920px);
  margin:0 auto;
  padding-top:clamp(10px,1.7vw,22px);
}
.page-title{
  margin:0 0 clamp(14px,1.5vw,20px);
  font-size:clamp(2.35rem,4vw,4.35rem);
  line-height:.9;
  letter-spacing:-.065em;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
}
.product-visual{
  position:relative;
  width:100%;
  height:min(39vw,410px);
  min-height:290px;
  overflow:hidden;
  background:var(--panel);
  isolation:isolate;
  cursor:pointer;
}
.product-visual img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  border:0;
  transition:opacity .7s cubic-bezier(.22,.61,.36,1),transform 1.1s cubic-bezier(.22,.61,.36,1);
  will-change:opacity,transform;
}
.product-visual .image-primary{
  z-index:1;
  opacity:1;
  object-fit:contain;
  object-position:center;
  padding:2.6%;
}
.product-visual .image-secondary{
  z-index:2;
  opacity:0;
  object-fit:cover;
  object-position:center;
}
.product-visual::after{
  content:"VIEW / HOVER";
  position:absolute;
  right:16px;
  bottom:14px;
  z-index:4;
  padding:7px 9px;
  color:rgba(242,238,244,.72);
  background:rgba(29,22,31,.38);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  font-size:8px;
  font-weight:700;
  letter-spacing:.14em;
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
}
@media(hover:hover) and (pointer:fine){
  .product-visual:hover::after{opacity:1}
  .product-visual:hover .image-primary{opacity:0;transform:scale(1.012)}
  .product-visual:hover .image-secondary{opacity:1;transform:scale(1.012)}
}
.product-visual.is-alt .image-primary{opacity:0;transform:scale(1.01)}
.product-visual.is-alt .image-secondary{opacity:1;transform:scale(1.01)}
.product-info{
  width:min(70vw,920px);
  margin:clamp(26px,3vw,38px) auto 0;
  display:block;
}
.index{
  padding-top:.55em;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:.15em;
}
.product-copy{
  width:min(720px,100%);
}
.product-title{
  margin:0;
  font-size:clamp(2.05rem,3.6vw,3.9rem);
  line-height:.92;
  letter-spacing:-.058em;
  font-weight:900;
  text-transform:uppercase;
}
.compatibility{
  margin-top:10px;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.description{
  width:min(610px,100%);
  margin-top:clamp(18px,2vw,26px);
  font-size:clamp(15px,1vw,17px);
  line-height:1.58;
  letter-spacing:-.01em;
}
.description p{margin:0 0 .42em}
.description .oem{
  margin-top:1.15em;
  font-weight:700;
  letter-spacing:.01em;
}
.footer{
  width:min(70vw,920px);
  margin:clamp(72px,8vw,120px) auto 0;
  padding-top:24px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.footer a{text-decoration:none;color:var(--fg);transition:opacity .2s ease}
.footer a:hover{opacity:.55}
@media(max-width:900px){
  .shell{padding-left:18px;padding-right:18px}
  .topbar{min-height:68px}
  .hero,.product-info,.footer{width:100%}
  .hero{padding-top:20px}
  .page-title{
    margin-bottom:14px;
    font-size:clamp(2.3rem,11vw,3.8rem);
    white-space:normal;
  }
  .product-visual{
    height:auto;
    min-height:0;
    aspect-ratio:5/4;
  }
  .product-info{
    margin-top:28px;
    grid-template-columns:1fr;
    gap:18px;
  }
  .index{padding-top:0}
  .product-title{font-size:clamp(2rem,9.5vw,3.6rem)}
  .description{margin-top:18px;font-size:15px}
}
@media(max-width:560px){
  .hero{padding-top:14px}
  .page-title{font-size:clamp(2.15rem,12vw,3.5rem)}
  .product-info{margin-top:24px}
  .footer{margin-top:88px;align-items:flex-start;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
  .product-visual img{transition:none!important}
}
.product-visual{background:#A3A3BA}
.product-visual .image-primary{
  inset:auto;
  top:-25%;
  left:0;
  width:100%;
  height:140%;
  padding:0;
  object-fit:contain;
}
.product-visual .image-secondary{
  inset:auto;
  top:50%;
  left:50%;
  width:auto;
  max-width:none;
  height:440%;
  object-fit:fill;
  translate:-35.5% -58%;
  transform-origin:35.5% 58%;
}
@media(max-width:900px){
  .product-visual .image-secondary{height:300%}
}

</style>
</head>
<body>
<main class="shell">
  <nav class="topbar">
    <a class="brand" href="../">LABWRK.</a>
    <span class="section-label">Products</span>
  </nav>

  <section class="hero">
    <h1 class="page-title">PRODUCTS.</h1>

    <div id="heroVisual" class="product-visual" role="button" tabindex="0" aria-label="Produktbild wechseln">
      <img class="image-primary" src="assets/embedded-04db9b3f18a4af37.png" alt="LABWRK Domlagerabdeckung Produktansicht">
      <img class="image-secondary" src="assets/embedded-4db0bce3bc9649ae.jpg" alt="LABWRK Domlagerabdeckung montiert im BMW Motorraum">
    </div>

  </section>

  <section class="product-info" aria-label="Produktinformationen">
    <div class="product-copy">
      <h2 class="product-title">DOMLAGERABDECKUNG.</h2>
      <div class="compatibility">BMW E60 · E61 · E63 · E64</div>
      <div class="description">
        <p>Abdeckung für den sichtbaren Domlagerbereich.</p>
        <p>Passend für BMW E60, E61, E63 und E64.</p>
        <p class="oem">OEM+ Optik</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <a href="../">← Back to LABWRK.</a>
    <span>Automotive Details / 2026</span>
  </footer>
</main>
<script>
(()=>{
  const hero=document.getElementById('heroVisual');
  const toggle=()=>hero.classList.toggle('is-alt');
  hero.addEventListener('click',e=>{
    if(matchMedia('(hover:hover) and (pointer:fine)').matches)return;
    e.preventDefault();
    toggle();
  });
  hero.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}
  });
})();
</script>
</body>
</html>
