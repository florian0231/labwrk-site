<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEBE7">
<meta name="description" content="LABWRK. Products — Domlagerabdeckung für BMW E60, E61, E63 und E64.">
<title>Products — LABWRK.</title>
<link rel="icon" type="image/png" href="../favicon.png">

<style>
:root {
  --bg:#ECEBE7;
  --fg:#0F1115;
  --muted:#7E8591;
  --muted2:#6A587C;
  --line:rgba(15,17,21,.10);
}

* { box-sizing:border-box; }

html {
  background:var(--bg);
  scroll-behavior:smooth;
}

body {
  margin:0;
  min-height:100vh;
  color:var(--fg);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at top left,#f7f6f2 0%,#ecebe7 58%,#e8e6ef 100%);
}

a { color:inherit; }

.topbar {
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  padding:22px 5vw;
  background:rgba(236,235,231,.84);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(15,17,21,.05);
}

.home {
  text-decoration:none;
  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
  font-size:18px;
  font-weight:900;
  letter-spacing:-.045em;
}

.section-label {
  color:var(--muted2);
  font-size:9px;
  letter-spacing:.18em;
  text-transform:uppercase;
}

.page {
  padding:9vh 5vw 14vh;
}

.shell {
  width:min(1520px,92vw);
  margin:0 auto;
}

.page-title {
  margin:0 0 7vh;
  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
  font-size:clamp(50px,7vw,112px);
  font-weight:900;
  line-height:.88;
  letter-spacing:-.06em;
  text-transform:uppercase;
}

.product-index {
  margin:0 0 16px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
}

.media-grid {
  display:grid;
  grid-template-columns:minmax(0,1.58fr) minmax(0,1fr);
  gap:22px;
  align-items:stretch;
}

.media {
  position:relative;
  overflow:hidden;
  min-height:0;
}

.media img {
  display:block;
  width:100%;
  height:100%;
  object-position:center;
  transition:transform .7s cubic-bezier(.2,.7,.2,1);
}

.media.install {
  aspect-ratio:6 / 5;
  background:#d9dbe6;
}

.media.install img {
  object-fit:cover;
}

.media.product-shot {
  aspect-ratio:6 / 5;
  background:linear-gradient(180deg,#cfd2df 0%,#d9dbe7 46%,#d1d4e3 100%);
}

.media.product-shot img {
  object-fit:contain;
  padding:4.5%;
}

@media (hover:hover) and (pointer:fine) {
  .media:hover img {
    transform:scale(1.016);
  }
}

.info {
  margin-top:30px;
  max-width:980px;
}

.product-title {
  margin:0;
  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
  font-size:clamp(34px,4.2vw,64px);
  font-weight:900;
  line-height:.92;
  letter-spacing:-.05em;
  text-transform:uppercase;
}

.fitment {
  margin:12px 0 0;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.copy {
  margin:22px 0 0;
  max-width:720px;
  color:var(--fg);
  font-size:16px;
  line-height:1.8;
}

.specs {
  display:flex;
  flex-wrap:wrap;
  gap:10px 20px;
  margin-top:26px;
  padding-top:18px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:9px;
  letter-spacing:.15em;
  text-transform:uppercase;
  max-width:760px;
}

.back-wrap {
  margin-top:14vh;
  padding-top:26px;
  border-top:1px solid var(--line);
}

.back {
  display:inline-block;
  text-decoration:none;
  color:var(--fg);
  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
  font-size:14px;
  font-weight:900;
  letter-spacing:-.02em;
  transition:transform .16s ease, opacity .16s ease, color .16s ease;
}

.back:hover {
  transform:translateX(-4px);
  opacity:1;
  color:var(--muted2);
}

footer {
  padding:34px 5vw 28px;
  text-align:center;
  color:var(--muted2);
  font-size:10px;
}

@media(max-width:980px) {
  .page {
    padding:7vh 18px 12vh;
  }

  .topbar {
    padding:18px;
  }

  .shell {
    width:100%;
  }

  .page-title {
    margin-bottom:5vh;
    font-size:clamp(42px,13vw,82px);
  }

  .media-grid {
    grid-template-columns:1fr;
    gap:14px;
  }

  .media.install,
  .media.product-shot {
    aspect-ratio:4 / 5;
  }

  .info {
    margin-top:24px;
  }

  .product-title {
    font-size:clamp(32px,10.2vw,54px);
  }

  .copy {
    font-size:14px;
    line-height:1.75;
  }

  .back-wrap {
    margin-top:10vh;
  }
}
</style>
</head>

<body>
<header class="topbar">
  <a class="home" href="../">LABWRK.</a>
  <span class="section-label">PRODUCTS</span>
</header>

<main class="page">
  <section class="shell">
    <h1 class="page-title">PRODUCTS.</h1>

    <article class="product">
      <div class="product-index">01</div>

      <div class="media-grid">
        <figure class="media install">
          <img src="assets/embedded-4db0bce3bc9649ae.jpg" alt="LABWRK. Domlagerabdeckung montiert im BMW Motorraum">
        </figure>

        <figure class="media product-shot">
          <img src="assets/embedded-04db9b3f18a4af37.png" alt="LABWRK. Domlagerabdeckung für BMW E60 E61 E63 E64">
        </figure>
      </div>

      <section class="info">
        <h2 class="product-title">DOMLAGERABDECKUNG.</h2>
        <p class="fitment">BMW E60 · E61 · E63 · E64</p>

        <p class="copy">
          Abdeckung für den sichtbaren Domlagerbereich.
          Passend für BMW E60, E61, E63 und E64.
          Für eine cleane OEM+ Optik im Motorraum.
        </p>

        <div class="specs">
          <span>BMW E60 · E61 · E63 · E64</span>
          <span>BLACK</span>
          <span>PAIR</span>
        </div>
      </section>
    </article>

    <div class="back-wrap">
      <a class="back" href="../">← BACK TO LABWRK.</a>
    </div>
  </section>
</main>

<footer>Copyright © LABWRK. 2026</footer>
</body>
</html>
